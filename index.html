<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fokus Todo App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- TOAST -->

<div class="toast" id="toast">

<i
id="toastIcon"
class="fa-solid fa-circle-check toast__icon">
</i>

<span id="toastMsg">
Task added
</span>

<button id="toastUndo">
Undo
</button>

<span id="toastTimer"></span>

</div>


<!-- MODAL -->

<div class="modal-overlay" id="modalOverlay">

<div class="modal">

<h2 id="modalTitle">
Clear all tasks?
</h2>

<p>
This action cannot be undone
</p>

<button id="modalCancel">
Cancel
</button>

<button id="modalConfirm">
Clear
</button>

</div>

</div>


<!-- SHORTCUT MODAL -->

<div
class="modal-overlay"
id="shortcutsOverlay">

<div class="modal">

<h2>Keyboard Shortcuts</h2>

<p>N → Add Task</p>

<p>Ctrl + Z → Undo</p>

<p>Ctrl + E → Export TXT</p>

<p>Ctrl + Shift + E → Export JSON</p>

<button id="shortcutsClose">

Close

</button>

</div>

</div>


<div class="app-wrapper">

<!-- SIDEBAR -->

<aside class="sidebar">

<h1>Fokus</h1>

<div>

<p id="clockTime">
00:00
</p>

<p id="clockDate">
Loading...
</p>

</div>


<div class="sidebar__stats">

<div>

<span id="statTotal">
0
</span>

<p>Total</p>

</div>


<div>

<span id="statDone">
0
</span>

<p>Done</p>

</div>


<div>

<span id="statPending">
0
</span>

<p>Pending</p>

</div>

</div>


<div>

<span id="progressPct">

0%

</span>

<div
class="progress-track"
id="progressTrack">

<div
id="progressFill">
</div>

</div>

</div>


<p id="quoteText">
Loading...
</p>


<button id="themeToggle">

<span id="themeLabel">

Light Mode

</span>

</button>


<button id="shortcutsBtn">

Shortcuts

</button>


<button id="exportTxt">

Export TXT

</button>


<button id="exportJson">

Export JSON

</button>

</aside>



<!-- MAIN -->

<main class="main">

<header>

<h2>

My Tasks

</h2>


<button id="clearAllBtn">

Clear All

</button>

</header>



<!-- ADD TASK -->

<div class="add-task-row">

<input
id="taskInput"
type="text"
maxlength="160"
placeholder="Add task">


<input
id="dueDateInput"
type="date">


<select id="prioritySelect">

<option value="high">

High

</option>

<option value="medium" selected>

Medium

</option>

<option value="low">

Low

</option>

</select>


<button id="addTaskBtn">

Add

</button>

</div>


<div>

Remaining:

<span id="charCount">

160

</span>

</div>



<!-- SEARCH -->

<div>

<input
id="searchInput"
type="search"
placeholder="Search tasks">

</div>



<!-- FILTERS -->

<div class="filter-tabs">

<button
class="filter-tab filter-tab--active"
data-filter="all">

All

</button>

<button
class="filter-tab"
data-filter="pending">

Pending

</button>

<button
class="filter-tab"
data-filter="completed">

Completed

</button>

<button
class="filter-tab"
data-filter="overdue">

Overdue

</button>

</div>



<ul
id="taskList"
class="task-list">
</ul>



<div
id="emptyState"
class="empty-state">

<h3 class="empty-state__title">

Nothing here yet

</h3>

<p class="empty-state__sub">

Add first task

</p>

</div>

</main>

</div>

<script src="script.js"></script>

</body>

</html>
